<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FinNotes - Masuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231e6b4e'/><path d='M18 22h28M18 32h28M18 42h18' stroke='%23f3f0e7' stroke-width='6' stroke-linecap='round'/></svg>" />
<meta name="description" content="Masuk ke FinNotes — catat keuangan kamu & partnermu dalam satu buku, cukup lewat chat." />
<meta name="theme-color" content="#f3f0e7" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="FinNotes" />
<meta property="og:locale" content="id_ID" />
<meta property="og:url" content="https://finnotes.tenzou.dev/login.html" />
<meta property="og:title" content="FinNotes — Catat Keuangan dari Chat" />
<meta property="og:description" content="Ketik seperti ngobrol: 'gaji 8jt', 'beli nasi 25rb'. Parser-nya yang nebak, saldonya kehitung, riwayatnya tersimpan. Satu buku untuk kamu & partnermu." />
<meta property="og:image" content="https://finnotes.tenzou.dev/img/og.png" />
<meta property="og:image:width" content="2400" />
<meta property="og:image:height" content="1260" />
<meta property="og:image:alt" content="FinNotes — buku kas digital: saldo Rp6.595.000 dari chat 'gaji 8jt' dan 'beli nasi 25rb sama kopi 15rb'" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="FinNotes — Catat Keuangan dari Chat" />
<meta name="twitter:description" content="Ketik seperti ngobrol; parser-nya yang nebak, saldonya kehitung. Satu buku untuk kamu & partnermu." />
<meta name="twitter:image" content="https://finnotes.tenzou.dev/img/og.png" />
</head>
<body class="auth-body">

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-mark"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="var(--green)"/><path d="M18 22h28M18 32h28M18 42h18" stroke="#f3f0e7" stroke-width="6" stroke-linecap="round"/></svg></span>
      <h1>FinNotes</h1>
      <p>Catat keuangan kamu & partnermu dalam satu buku</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab is-active" data-mode="login">Masuk</button>
      <button class="auth-tab" data-mode="signup">Daftar</button>
    </div>

    <form id="authForm" autocomplete="on">
      <div class="field" data-only="signup" hidden>
        <label for="fName">Nama</label>
        <input id="fName" type="text" placeholder="Nama kamu" autocomplete="name" />
      </div>

      <div class="field">
        <label for="fEmail">Email</label>
        <input id="fEmail" type="email" required placeholder="kamu@email.com" autocomplete="email" />
      </div>

      <div class="field">
        <label for="fPass">Password</label>
        <input id="fPass" type="password" required minlength="6" placeholder="Minimal 6 karakter" autocomplete="current-password" />
      </div>

      <div class="field" data-only="signup" hidden>
        <label for="fHouse">Nama Buku</label>
        <input id="fHouse" type="text" placeholder="Rumah Tangga" value="Rumah Tangga" />
      </div>

      <details class="join-box" data-only="signup" hidden>
        <summary>Sudah punya kode undangan?</summary>
        <div class="field">
          <label for="fCode">Kode Undangan</label>
          <input id="fCode" type="text" placeholder="Contoh: K7X2MQ" maxlength="6" style="text-transform:uppercase" />
          <small>Masuk ke buku pasangan yang sudah ada.</small>
        </div>
      </details>

      <p class="auth-err" id="authErr" hidden></p>
      <button type="submit" class="auth-btn" id="authBtn">Masuk</button>
    </form>

    <div class="auth-alt" id="authAlt" hidden><small>atau</small></div>
    <button type="button" class="oauth-btn" id="btnGoogle" hidden>
      <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
      <span id="btnGoogleLabel">Lanjutkan dengan Google</span>
    </button>

    <p class="auth-hint" id="authHint"></p>
  </div>
</div>

<script type="module" src="./auth.js"></script>
</body>
</html>
